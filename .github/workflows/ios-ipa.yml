name: Build Rec Room Reborn iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml --project ios
      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project ios/RecRoomReborn.xcodeproj \
            -scheme RecRoomReborn \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RecRoomReborn.app Payload/
          zip -r RecRoomReborn-unsigned.ipa Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecRoomReborn-unsigned-IPA
          path: RecRoomReborn-unsigned.ipa
          if-no-files-found: error
